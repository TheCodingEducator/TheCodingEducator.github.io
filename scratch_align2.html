<!doctype html>
<html><head>
<script src="exponent-racer/exponent-racer-p5.min.js"></script>
</head>
<body>
<script>
function setup() { createCanvas(400, 400); noLoop(); }
function draw() {
  background(0);
  fill(255); noStroke();
  textFont("sans-serif");
  textSize(22);

  // Set some non-default alignment first, like TOP
  textAlign(LEFT, TOP);
  text("dummy", 10, 10);

  // Now call textAlign with a SINGLE argument, like the game does
  textAlign(CENTER);

  // Draw a probe character to see where it actually lands vertically
  text("5", 100, 100);
}
window.scanInk = function(xCenter, xHalfWidth, yStart, yEnd) {
  var c = document.querySelector('canvas');
  var ctx = c.getContext('2d');
  var data = ctx.getImageData(xCenter - xHalfWidth, yStart, xHalfWidth * 2, yEnd - yStart).data;
  var w = xHalfWidth * 2, h = yEnd - yStart;
  var minY = null, maxY = null;
  for (var yy = 0; yy < h; yy++) {
    for (var xx = 0; xx < w; xx++) {
      var idx = (yy * w + xx) * 4;
      if (data[idx] > 50) { if (minY === null || yy < minY) minY = yy; if (maxY === null || yy > maxY) maxY = yy; }
    }
  }
  return minY === null ? null : { topY: yStart + minY, bottomY: yStart + maxY };
};
</script>
</body></html>
