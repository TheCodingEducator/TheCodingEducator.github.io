<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found - StudentMathGames</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #111318;
    --panel: #1b1e27;
    --text: #f2f3f7;
    --muted: #9aa0ae;
    --accent: #5b8cff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 420px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 40px;
  }

  p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    margin: 0 0 24px;
  }

  a.button {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 10px;
  }

  a.button:hover, a.button:focus-visible {
    filter: brightness(1.1);
    outline: 3px solid #fff;
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="panel">
  <h1>404</h1>
  <p>We couldn't find that page. It might have moved, or the link might be mistyped.</p>
  <a class="button" href="/">Back to games</a>
</div>

</body>
</html>
