<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Student Math Games">
  <!-- Student Math Games logo: plus, minus, times and divide buttons on a tile of graph paper.
       Each side of the border takes the color of the button facing it. -->
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#d9e6f5" stroke-width="1.2"/></pattern>
  </defs>
  <rect x="6" y="6" width="88" height="88" rx="26" fill="#fff"/>
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#grid)"/>
  <rect x="6" y="6" width="88" height="88" rx="26" fill="none" stroke="#c2471b" stroke-width="4"/>
  <g fill="none" stroke-width="4.6" stroke-linecap="round">
    <path d="M36 6H64" stroke="#1f7a70"/>
    <path d="M6 36V64" stroke="#4b4bc4"/>
    <path d="M94 36V64" stroke="#b83a66"/>
    <path d="M36 94H64" stroke="#e0a21a"/>
  </g>
  <!-- white rings -->
  <g fill="#fff">
    <circle cx="50" cy="29.1" r="16"/><circle cx="29.1" cy="50" r="16"/><circle cx="70.9" cy="50" r="16"/><circle cx="50" cy="70.9" r="16"/>
  </g>
  <!-- the buttons -->
  <circle cx="50" cy="29.1" r="13.3" fill="#1f7a70"/>
  <circle cx="29.1" cy="50" r="13.3" fill="#4b4bc4"/>
  <circle cx="70.9" cy="50" r="13.3" fill="#b83a66"/>
  <circle cx="50" cy="70.9" r="13.3" fill="#e0a21a"/>
  <g stroke="#fff" stroke-width="4.6" stroke-linecap="round">
    <path d="M43.35 29.1H56.65M50 22.45V35.75"/>
    <path d="M22.45 50H35.75"/>
    <path d="M65.96 45.06L75.84 54.94M75.84 45.06L65.96 54.94"/>
    <path d="M43.35 70.9H56.65" stroke-width="4.2"/>
  </g>
  <circle cx="50" cy="64.44" r="2.66" fill="#fff"/>
  <circle cx="50" cy="77.36" r="2.66" fill="#fff"/>
</svg>
